name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  android-release:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    concurrency:
      group: streamdek-android-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail

          tag_name="${GITHUB_REF_NAME}"
          version_name="${tag_name#v}"
          if [ -z "$version_name" ] || [ "$version_name" = "$tag_name" ]; then
            echo "Release tag must use the vX.Y.Z format."
            exit 1
          fi
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use a semantic version like v1.2.3."
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Detect Android project
        id: android
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f "android/gradlew" ]; then
            project_dir="android"
          else
            project_dir="$(find . -maxdepth 4 -name gradlew -path '*/android/gradlew' -print -quit | sed 's#/gradlew$##')"
          fi

          if [ -z "${project_dir:-}" ] || [ ! -f "$project_dir/gradlew" ]; then
            echo "No Android Gradle project found."
            exit 1
          fi
          chmod +x "$project_dir/gradlew"

          app_dir="$project_dir/app"
          if [ ! -f "$app_dir/build.gradle" ] && [ ! -f "$app_dir/build.gradle.kts" ]; then
            echo "Android app module not found at $app_dir."
            exit 1
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"

      - name: Write CI environment file
        shell: bash
        env:
          STREAMDEK_API_URL_VAR: ${{ vars.STREAMDEK_API_URL }}
          STREAMDEK_API_URL_SECRET: ${{ secrets.STREAMDEK_API_URL }}
        run: |
          set -Eeuo pipefail


          if [ -z "$api_url" ]; then
            echo "STREAMDEK_API_URL repository variable or secret is required."
            exit 1
          fi

          printf 'STREAMDEK_API_URL=%s\n' "$api_url" > .env

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for required_secret in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!required_secret:-}" ]; then
              echo "$required_secret secret is required."
              exit 1
            fi
          done
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ steps.android.outputs.app_dir }}/streamdek-release.jks"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi

      - name: Build release APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: streamdek-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STREAMDEK_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          STREAMDEK_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -Eeuo pipefail
          ./gradlew --no-daemon clean assembleRelease

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          apk_path="$(find "${{ steps.android.outputs.app_dir }}/build/outputs/apk/release" -name '*.apk' -print -quit)"
          if [ -z "${apk_path:-}" ]; then
            echo "Release APK was not produced."
            exit 1
          fi
          release_apk="dist/streamdek-${{ github.ref_name }}.apk"
          cp "$apk_path" "$release_apk"
          echo "apk_path=$release_apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdek-${{ github.ref_name }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Detect custom release notes
        id: release_notes
        shell: bash
        run: |
          set -Eeuo pipefail
          notes_path=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_path" ]; then
            echo "body_path=$notes_path" >> "$GITHUB_OUTPUT"
            echo "has_custom=true" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "has_custom=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (custom notes)
        if: steps.release_notes.outputs.has_custom == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          fail_on_unmatched_files: true

      - name: Create GitHub Release (generated notes)
        if: steps.release_notes.outputs.has_custom != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
