apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def versionPropertiesFile = rootProject.file("version.properties")
def versionProperties = new Properties()
if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}
def defaultVersionName = versionProperties.getProperty("VERSION_NAME", "1.0.0")
def defaultVersionCode = versionProperties.getProperty("VERSION_CODE", "1")
def ciVersionName = (findProperty("STREAMDEK_VERSION_NAME") ?: System.getenv("STREAMDEK_VERSION_NAME") ?: defaultVersionName).toString()
def ciVersionCode = (findProperty("STREAMDEK_VERSION_CODE") ?: System.getenv("STREAMDEK_VERSION_CODE") ?: defaultVersionCode).toString().toInteger()
def ciStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def ciStorePassword = System.getenv("ANDROID_STORE_PASSWORD")
def ciKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def ciKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def ciSigningEnabled = ciStoreFile && ciStorePassword && ciKeyAlias && ciKeyPassword
def localEnvFile = file("${projectRoot}/.env")

def loadEnvValue = { String key, String fallback = "" ->
    def fromGradle = findProperty(key)
    if (fromGradle != null && fromGradle.toString().trim()) {
        return fromGradle.toString().trim()
    }

    def fromSystem = System.getenv(key)
    if (fromSystem != null && fromSystem.toString().trim()) {
        return fromSystem.toString().trim()
    }

    if (localEnvFile.exists()) {
        def match = localEnvFile.readLines().find { line ->
            def trimmed = line.trim()
            trimmed && !trimmed.startsWith("#") && trimmed.startsWith("${key}=")
        }
        if (match != null) {
            return match.substring(match.indexOf('=') + 1).trim()
        }
    }

    return fallback
}

def apiBaseUrl = loadEnvValue("STREAMDEK_API_URL", "https://api.streamdek.net")
// StreamDek's own IntroDB key, used for skip-segment lookups when the viewer has not supplied one.
// IntroDB serves reads anonymously, so an empty value here still works — it just shares the
// unauthenticated rate limit rather than StreamDek's own allowance.
def introdbApiKey = loadEnvValue("STREAMDEK_INTRODB_API_KEY", "")

// Premiumize's OAuth client id, for signing in without typing an API key.
//
// Not a secret: a phone or a television is a public OAuth client, so anything compiled in can be
// read straight back out of the package. Premiumize's device flow asks only for this id, and the
// client secret issued alongside it is deliberately not built into the app — there is nowhere in a
// shipped binary it could be kept. Blank simply hides the option and leaves key entry working.
def premiumizeClientId = loadEnvValue("STREAMDEK_PREMIUMIZE_CLIENT_ID", "")

android {
    namespace = "net.streamdek.mobile"
    compileSdk = 36
    buildToolsVersion = "36.0.0"
    ndkVersion = "27.1.12297006"

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "net.streamdek.mobile"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode = ciVersionCode
        versionName = ciVersionName
        ndk {
            abiFilters = ["arm64-v8a", "armeabi-v7a"]
        }

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "INTRODB_API_KEY", "\"${introdbApiKey}\""
        buildConfigField "String", "PREMIUMIZE_CLIENT_ID", "\"${premiumizeClientId}\""
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        release {
            if (ciSigningEnabled) {
                storeFile = file(ciStoreFile)
                storePassword = ciStorePassword
                keyAlias = ciKeyAlias
                keyPassword = ciKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = ciSigningEnabled ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            java {
                exclude(
                    "**/PiPModule.kt",
                    "**/PiPPackage.kt",
                    "**/updates/**",
                    "**/torrent/TorrentServerModule.kt",
                    "**/torrent/TorrentServerPackage.kt",
                    "**/mpv/MpvPackage.kt",
                    "**/mpv/MpvPlayerViewManager.kt",
                )
            }
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20251224")
    implementation(platform("androidx.compose:compose-bom:2026.01.00"))
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("androidx.core:core-ktx:1.17.0")
    implementation("androidx.activity:activity-compose:1.10.1")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.animation:animation")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("dev.chrisbanes.haze:haze:2.0.0-alpha03")
    implementation("dev.chrisbanes.haze:haze-blur:2.0.0-alpha03")
    implementation("dev.chrisbanes.haze:haze-blur-materials:2.0.0-alpha03")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("io.coil-kt:coil-compose:2.7.0")
    // Schedules the "new episode is out" reminders; see EpisodeReleaseNotifications.
    implementation("androidx.work:work-runtime-ktx:2.9.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0")
    implementation("org.jsoup:jsoup:1.18.3")
    implementation files("libs/quickjs-runtime.aar")
    implementation("androidx.media3:media3-exoplayer:1.8.0")
    implementation("androidx.media3:media3-exoplayer-hls:1.8.0")
    // Media3 resolves the media source and downloader for a content type reflectively, by class
    // name, from whichever of these modules is on the classpath. With only HLS present, a DASH
    // (.mpd) source threw IllegalStateException("Module missing for content type 0") - on the
    // main thread when one was tapped, and on DownloadManager's own thread for every launch
    // after one had been queued for download, which killed the process before the UI drew.
    implementation("androidx.media3:media3-exoplayer-dash:1.8.0")
    implementation("androidx.media3:media3-exoplayer-smoothstreaming:1.8.0")
    implementation("androidx.media3:media3-datasource:1.8.0")
    implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
    implementation("androidx.media3:media3-ui:1.8.0")
    implementation files("libs/lib-decoder-ffmpeg-release.aar")
    implementation files("libs/libmpv-release.aar")
    // libtorrent4j, not FrostWire's jlibtorrent, which this replaced.
    //
    // jlibtorrent's last release is from September 2018 and wraps libtorrent 1.2.0, which finds
    // the machine's network interfaces by binding a NETLINK_ROUTE socket. SELinux has denied that
    // to untrusted apps since Android 11 (b/155595000), so on any current phone the session
    // enumerated no interfaces, opened no listen socket, and reported `bind: Permission denied` -
    // no DHT, no tracker announce and no peer, for every source. It is not configurable around.
    //
    // libtorrent4j is the maintained continuation of the same SWIG bindings by the same author,
    // so the API here is nearly unchanged. Its native library falls back to getifaddrs(), which is
    // what makes a listen socket possible at all, and it is built 16 KB-page aligned for Android 16.
    implementation("org.libtorrent4j:libtorrent4j:2.1.0-39")
    implementation("org.libtorrent4j:libtorrent4j-android-arm:2.1.0-39")
    implementation("org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39")

    // --- CloudStream (.cs3) plugin support ---
    // A .cs3 extension is compiled Kotlin/JVM bytecode written against the real
    // `com.lagradost.cloudstream3` provider API, so that API has to exist on this app's own
    // runtime classpath before a loaded plugin's superclasses (Plugin/BasePlugin/MainAPI/...)
    // can resolve. There is no Maven artifact for it: the jar every extension repo compiles
    // against is published as a plain release asset at
    //   https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar
    // (that is exactly what recloudstream's own Gradle plugin downloads for `compileOnly`).
    //
    // libs/cloudstream-provider-runtime.jar is that jar trimmed to the provider-facing runtime:
    // the model layer, MainAPI/APIHolder, utils, extractors, network, mvvm, metaproviders,
    // syncproviders and the plugin base classes — with CloudStream's own UI, player, downloader
    // and database packages removed, since nothing a provider calls reaches them. Regenerate it
    // by re-trimming a newer classes.jar if plugins start failing on a newer plugin apiVersion.
    //
    // NOTE: CloudStream is GPL-3.0. Shipping these classes has licensing consequences for
    // StreamDek's own distribution - that is a product decision, not a technical one.
    implementation files("libs/cloudstream-provider-runtime.jar")

    // Versions below are pinned to recloudstream/cloudstream's own gradle/libs.versions.toml so
    // the trimmed runtime (and the plugins compiled against it) link against what they expect.
    implementation("com.github.Blatzar:NiceHttp:0.4.18")
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.8.0")
    implementation("dev.whyoleg.cryptography:cryptography-core:0.6.0")
    implementation("dev.whyoleg.cryptography:cryptography-provider-optimal:0.6.0")
    implementation("io.ktor:ktor-http:3.5.0")
    implementation("com.fleeksoft.ksoup:ksoup:0.2.6")
    implementation("org.mozilla:rhino:1.8.1")
    implementation("io.coil-kt.coil3:coil:3.3.0")
    implementation("androidx.preference:preference-ktx:1.2.1")
    // Used directly by a number of extensions rather than by the runtime itself.
    implementation("com.google.code.gson:gson:2.11.0")
}
