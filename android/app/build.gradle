apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def ciVersionName = (findProperty("STREAMDEK_VERSION_NAME") ?: System.getenv("STREAMDEK_VERSION_NAME") ?: "2.0.0").toString()
def ciVersionCode = (findProperty("STREAMDEK_VERSION_CODE") ?: System.getenv("STREAMDEK_VERSION_CODE") ?: "2000000").toString().toInteger()
def ciStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def ciStorePassword = System.getenv("ANDROID_STORE_PASSWORD")
def ciKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def ciKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def ciSigningEnabled = ciStoreFile && ciStorePassword && ciKeyAlias && ciKeyPassword
def localEnvFile = file("${projectRoot}/.env")

def loadEnvValue = { String key, String fallback = "" ->
    def fromGradle = findProperty(key)
    if (fromGradle != null && fromGradle.toString().trim()) {
        return fromGradle.toString().trim()
    }

    def fromSystem = System.getenv(key)
    if (fromSystem != null && fromSystem.toString().trim()) {
        return fromSystem.toString().trim()
    }

    if (localEnvFile.exists()) {
        def match = localEnvFile.readLines().find { line ->
            def trimmed = line.trim()
            trimmed && !trimmed.startsWith("#") && trimmed.startsWith("${key}=")
        }
        if (match != null) {
            return match.substring(match.indexOf('=') + 1).trim()
        }
    }

    return fallback
}

def apiBaseUrl = loadEnvValue("STREAMDEK_API_URL", "https://api.streamdek.net")

android {
    namespace = "net.streamdek.mobile"
    compileSdk = 36
    buildToolsVersion = "36.0.0"
    ndkVersion = "27.1.12297006"

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.anonymous.streamdekmobile"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode = ciVersionCode
        versionName = ciVersionName
        ndk {
            abiFilters = ["arm64-v8a", "armeabi-v7a"]
        }

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    signingConfigs {
        debug {
            storeFile = file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        release {
            if (ciSigningEnabled) {
                storeFile = file(ciStoreFile)
                storePassword = ciStorePassword
                keyAlias = ciKeyAlias
                keyPassword = ciKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = ciSigningEnabled ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main {
            java {
                exclude(
                    "**/PiPModule.kt",
                    "**/PiPPackage.kt",
                    "**/updates/**",
                    "**/torrent/TorrentServerModule.kt",
                    "**/torrent/TorrentServerPackage.kt",
                    "**/mpv/MpvPackage.kt",
                    "**/mpv/MpvPlayerViewManager.kt",
                )
            }
        }
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }

    androidResources {
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
}

